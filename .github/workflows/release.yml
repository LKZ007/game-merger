# Builds GameMergerSetup.exe on Windows. When gamemerger/version.py has a version that hasn't
# been released yet, it publishes it as release vX.Y.Z. Installed copies update from these.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        # PyInstaller's bootloader is compiled here from source instead of using the prebuilt one,
        # which antivirus tools often flag (false positives shared by every PyInstaller app).
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-binary pyinstaller pyinstaller

      - name: Test
        run: python -m unittest discover -s tests

      - name: Is this version new?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "from gamemerger.version import VERSION; print(VERSION)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        run: >
          python installer/version_info.py &&
          pyinstaller --noconfirm --onedir --windowed --noupx --name GameMerger
          --version-file installer\version_info.txt
          --icon installer\GameMerger.ico --collect-data edge_tts
          --add-data "gamemerger\recipes;gamemerger\recipes"
          --add-data "gamemerger\web;gamemerger\web"
          --add-data "gamemerger\xtts_server.py;gamemerger" GameMerger.pyw

      - name: Build installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress | Out-Null }
          & $nsis "-DVER=${{ steps.ver.outputs.version }}" installer\GameMerger.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: GameMergerSetup
          path: dist/GameMergerSetup.exe

      - name: Publish release
        if: steps.ver.outputs.new == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Game Merger ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/GameMergerSetup.exe
          body_path: installer/release-notes.md
