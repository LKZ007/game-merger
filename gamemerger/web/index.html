<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frankenstein</title>
<link rel="icon" href="logo/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Every start loads this version's own scripts and styles fresh (never an older copy the web view kept)
  window.PAGE_BUILD = "3.31.1";
  window.ASSET_V = window.PAGE_BUILD + "-" + Date.now();
  document.write('<link rel="stylesheet" href="app.css?v=' + window.ASSET_V + '">');
</script>
</head>
<body>
<div class="splash" id="splash" role="status" aria-live="polite">
  <div class="splash-stage" id="splashStage" aria-label="Frankenstein" role="img">
    <img class="sp-base" src="logo/base.png" alt="">
    <canvas class="brain sp-brain" data-brain="front" aria-hidden="true"></canvas>
    <div class="sp-cover l" id="spCoverL"><div class="sp-card"></div></div>
    <div class="sp-cover r" id="spCoverR"><div class="sp-card"></div></div>
    <img class="sp-hand l" id="spHandL" src="logo/hand_l.png" alt="">
    <img class="sp-hand r" id="spHandR" src="logo/hand_r.png" alt="">
  </div>
  <div class="logo splash-logo">FRANKEN<span>STEIN</span></div>
  <div class="splash-line" id="splashLine">It's alive! Finding your games…</div>
  <div class="bar splash-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="splashFill"></div></div>
</div>
<canvas class="splash-burst" id="splashBurst" aria-hidden="true"></canvas>
<div class="winbar hidden" id="winbar">
  <div class="grow"></div>
  <button class="win-btn" id="winMin" aria-label="Minimise" title="Minimise"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
  <button class="win-btn" id="winFull" aria-label="Full screen" title="Full screen (F11)"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="to-full" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="to-window" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
  <button class="win-btn close" id="winClose" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
<div class="app">
  <nav class="nav" aria-label="Main">
    <div class="logo"><img class="logo-brain" src="logo/icon.png" alt="" aria-hidden="true">FRANKEN<span>STEIN</span></div>
    <button class="nav-item active" data-view="library"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Library</button>
    <button class="nav-item" data-view="merges"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v6a4 4 0 0 0 8 0V3"/><path d="M12 13v8"/></svg>My merges</button>
    <button class="nav-item" data-view="party"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M14.5 14.5c.8-.3 1.6-.5 2.5-.5 2.8 0 5 2.2 5 5"/></svg>Play together</button>
    <button class="nav-item" data-view="gallery"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></svg>Gallery</button>
    <button class="nav-item" data-view="quests"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h12l4 4v12H4z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Questlines</button>
    <button class="nav-item" data-view="awards"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Achievements</button>
    <button class="nav-item" data-view="backups"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Backups</button>
    <button class="nav-item" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</button>
    <div class="grow"></div>
    <button class="nav-item" id="navUpdate" title="Check GitHub for a newer Frankenstein right now"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/></svg><span>Check for updates</span></button>
    <button class="me-chip" id="meChip"></button>
    <div class="nav-foot" id="navFoot">Looking for games…</div>
  </nav>

  <main class="main" id="main">
    <section class="view" id="view-library"></section>
    <section class="view hidden" id="view-setup"></section>
    <section class="view hidden" id="view-merges"></section>
    <section class="view hidden" id="view-party"></section>
    <section class="view hidden" id="view-gallery"></section>
    <section class="view hidden" id="view-quests"></section>
    <section class="view hidden" id="view-awards"></section>
    <section class="view hidden" id="view-backups"></section>
    <section class="view hidden" id="view-settings"></section>
  </main>

</div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div class="toast hidden" id="toast" role="status"></div>

<script>
  ["brain.js", "app.js", "gamepad.js"].forEach(function (f) { document.write('<script src="' + f + '?v=' + window.ASSET_V + '"><\/script>'); });
</script>
<script>
  // The startup screen can never keep you out: Skip after a few seconds (or Esc / a click), gone by itself
  // after 30, and a script error or mixed-up install is shown and reported instead of a frozen screen.
  (function () {
    var t0 = Date.now(), errors = [];
    function splash() { var s = document.getElementById("splash"); return s && !s.classList.contains("gone") ? s : null; }
    function line(text) { var l = document.getElementById("splashLine"); if (l) l.textContent = text; }
    function report(text) {
      try { if (window.pywebview && window.pywebview.api && window.pywebview.api.report_js_error) window.pywebview.api.report_js_error(text); } catch (e) {}
    }
    function skip() {
      var s = splash();
      if (!s) return;
      s.classList.add("gone");
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 700);
    }
    window.skipSplash = skip;
    window.addEventListener("error", function (e) {
      var text = (e && e.message ? e.message : "script error") + (e && e.filename ? " (" + e.filename.split("/").pop().split("?")[0] + ":" + e.lineno + ")" : "");
      errors.push(text);
      report(text);
      if (splash()) { line("Something went wrong starting up: " + text + ". Opening anyway…"); setTimeout(skip, 2500); }
    });
    window.addEventListener("keydown", function (e) { if (e.key === "Escape" && Date.now() - t0 > 1500) skip(); });
    var btn = document.createElement("button");
    btn.className = "btn ghost splash-skip";
    btn.textContent = "Skip";
    btn.onclick = skip;
    var tick = setInterval(function () {
      var s = splash(), age = (Date.now() - t0) / 1000;
      if (!s) return clearInterval(tick);
      if (age > 2 && window.APP_BUILD !== window.PAGE_BUILD) {
        // the page and its script are from different versions: say so, open, and let the self-check repair it
        line("Frankenstein's files are from two different versions. Opening anyway; Settings > Repair fixes it.");
        report("mixed install: page " + window.PAGE_BUILD + ", script " + (window.APP_BUILD || "old"));
        clearInterval(tick);
        return setTimeout(skip, 3000);
      }
      if (age > 6 && !btn.parentNode) s.appendChild(btn);
      if (age > 30) { report("startup took over 30 s"); skip(); }
    }, 500);
  })();
</script>
</body>
</html>
